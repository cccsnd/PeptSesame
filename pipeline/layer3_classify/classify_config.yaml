# PeptSesame Layer3 — Classification Configuration
# =================================================
# Parameters for small peptide classification modules.

# Minimum and maximum ORF lengths (aa) per category
length_limits:
  SSP:
    min: 20
    max: 300
  miPEP:
    min: 8
    max: 100
  uORF:
    min: 5
    max: 100
  lncORF:
    min: 5
    max: 150
  AMP:
    min: 10
    max: 150

# AMP classification thresholds
amp:
  classification_threshold: 0.5   # minimum combined score for AMP
  ideal_hydrophobic_ratio: 0.4
  ideal_net_charge_min: 2
  ideal_net_charge_max: 9
  min_charge_for_amp: 1
  min_pl_for_amp: 8.0
  min_db_jaccard: 0.2

# SSP motif matching
ssp:
  min_match_confidence: 0.4
  confidence_per_residue: 0.02

# Location classification
location:
  default_confidence: 0.8  # when clear overlap found
  intergenic_confidence: 0.5  # when no GFF loaded

# Report generation
report:
  confidence_decimals: 4
  frequency_decimals: 4
