name: peptsesame
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython>=1.79
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.7
  - scikit-learn>=1.0
  - pyyaml>=6.0
  - requests>=2.28
  - openpyxl>=3.0
  - matplotlib>=3.5
  - seaborn>=0.12
  - pip
  - pip:
      - lightgbm>=3.3   # optional ML channel (inactive by default)
      - -e .
