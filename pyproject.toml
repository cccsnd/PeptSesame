[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peptsesame"
version = "1.0.0"
description = "Evidence-layered prioritization framework for plant sORF-encoded peptide candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PeptSesame developers"}]
keywords = ["sORF", "small peptide", "SSP", "bioinformatics", "plant genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "biopython>=1.79",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.optional-dependencies]
ml = ["lightgbm>=3.3"]
slurm = []

[project.scripts]
peptsesame = "scripts.cli:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.layer1_sixframe", "pipeline.layer2_scoring",
            "pipeline.layer3_classify", "pipeline.layer4_function",
            "pipeline.plantptm", "scripts"]
